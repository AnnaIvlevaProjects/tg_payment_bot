[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gbn-tools"
version = "0.1.0"
description = "Utilities for indexing and querying Google Books Ngram data"
requires-python = ">=3.12"
dependencies = [
  "duckdb>=1.0.0",
  "pyarrow>=15.0.0",
]

[tool.setuptools]
py-modules = []
